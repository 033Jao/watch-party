<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sessão — assistir junto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1426;--panel:#251d36;--line:#3a2f52;--text:#f3ecff;--muted:#a99cc4;--lamp:#ffb547;color-scheme:dark;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:.7rem .9rem}
input{background:var(--panel);color:var(--text);width:100%}
button{background:var(--lamp);color:#1a1426;font-weight:600;border-color:var(--lamp);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
#lobby{max-width:420px;margin:12vh auto;padding:1.5rem;display:grid;gap:.8rem}
h1{font-size:3rem;font-weight:800;line-height:.95;margin:0 0 .5rem;letter-spacing:-.03em}
.hint{color:var(--muted);margin:0 0 1rem}
#app{display:none;grid-template-columns:1fr 340px;height:100vh}
#stage{padding:1rem;display:flex;flex-direction:column;gap:.8rem;min-width:0}
.bar{display:flex;gap:.5rem}
.code{color:var(--muted)} .code b{color:var(--lamp);font-size:1.2rem;letter-spacing:.1em}
#screen{aspect-ratio:16/9;width:100%;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 0 80px -20px var(--lamp)}
#screen iframe,#ytWrap,#vid{width:100%;height:100%;display:block} #vid[hidden],#ytWrap[hidden]{display:none}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.msg b{color:var(--lamp)} .sys{color:var(--muted);font-size:.85rem}
#chatForm{display:flex;gap:.5rem;padding:.8rem;border-top:1px solid var(--line)}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}#side{border-left:0;border-top:1px solid var(--line);min-height:50vh}}
</style>
</head>
<body>
<form id="lobby">
  <h1>Assistir junto, no mesmo segundo.</h1>
  <p class="hint">Crie uma sala e mande o código para os amigos. Play, pausa e pulos ficam sincronizados.</p>
  <input id="name" placeholder="Seu nome" required maxlength="20">
  <input id="roomIn" placeholder="Código da sala (vazio para criar uma)" maxlength="8">
  <button>Entrar na sala</button>
</form>

<main id="app">
  <section id="stage">
    <div class="code">Sala <b id="roomCode"></b> — mande este código para os amigos</div>
    <form class="bar" id="loadForm">
      <input id="url" placeholder="Link do YouTube ou de vídeo (.mp4, .m3u8)">
      <button>Assistir</button>
    </form>
    <div id="screen"><div id="ytWrap"><div id="player"></div></div><video id="vid" playsinline controls hidden></video></div>
  </section>
  <aside id="side">
    <div id="log"></div>
    <form id="chatForm"><input id="chatIn" placeholder="Mensagem" maxlength="500"><button>Enviar</button></form>
  </aside>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const socket = io();
const vid = $('vid');
let yt, ytReady = false, kind = null, current = null, hls = null, applying = false, state = null;

const expected = s => s.time + (s.playing ? (Date.now() - s.updatedAt) / 1000 : 0);
const ytId = url => (url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/) || [])[1] || (/^[\w-]{11}$/.test(url) ? url : null);
// Fonte do vídeo: "yt:ID" para YouTube ou "url:https://..." para qualquer vídeo da web
const parseSrc = input => ytId(input) ? 'yt:' + ytId(input) : /^https?:\/\//.test(input) ? 'url:' + input : null;

// Controles iguais para os dois tipos de player
const P = {
  time: () => kind === 'yt' ? (ytReady ? yt.getCurrentTime() : 0) : vid.currentTime,
  seek: t => kind === 'yt' ? yt.seekTo(t, true) : (vid.currentTime = t),
  play: () => kind === 'yt' ? yt.playVideo() : vid.play().catch(() => log('Toque no play do vídeo para começar.', 'sys')),
  pause: () => kind === 'yt' ? yt.pauseVideo() : vid.pause(),
};

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('player', { playerVars: { playsinline: 1, rel: 0 },
    events: { onReady: () => { ytReady = true; if (state) apply(state); },
              onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) localChange(true);
                                    if (e.data === YT.PlayerState.PAUSED) localChange(false); } } });
}

function loadSrc(src, t) {
  current = src;
  const i = src.indexOf(':'); kind = src.slice(0, i); const v = src.slice(i + 1);
  $('ytWrap').hidden = kind !== 'yt'; vid.hidden = kind === 'yt';
  if (hls) { hls.destroy(); hls = null; }
  if (kind === 'yt') { vid.pause(); yt.cueVideoById(v, t); return; }
  if (ytReady) yt.pauseVideo();
  if (/\.m3u8/i.test(v) && window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(v); hls.attachMedia(vid);
    hls.on(Hls.Events.ERROR, (_, d) => d.fatal && log('Esse link de transmissão não abriu (o site pode bloquear).', 'sys'));
  } else vid.src = v;
  vid.addEventListener('loadedmetadata', () => { vid.currentTime = t; }, { once: true });
}

// Aplica o estado da sala sem reenviar eventos
function apply(s) {
  state = s;
  if (!s.videoId || (s.videoId.startsWith('yt:') && !ytReady)) return;
  applying = true;
  if (current !== s.videoId) loadSrc(s.videoId, expected(s));
  else if (Math.abs(P.time() - expected(s)) > 1) P.seek(expected(s));
  s.playing ? P.play() : P.pause();
  setTimeout(() => applying = false, 800);
}

function localChange(playing) {
  if (applying || !state) return;
  if (playing && !state.playing) send('play', P.time());
  if (!playing && state.playing) send('pause', P.time());
}
vid.onplay = () => localChange(true);
vid.onpause = () => localChange(false);
vid.onerror = () => vid.src && log('Esse vídeo não abriu. Use um link direto de vídeo (.mp4, .webm ou .m3u8).', 'sys');

function send(type, time, videoId) {
  state = { ...state, videoId: videoId ?? state.videoId, playing: type === 'play' || (type === 'seek' && state.playing),
            time: time ?? 0, updatedAt: Date.now() };
  socket.emit('action', { type, time, videoId });
}

// Detecta quando alguém arrasta a barra do vídeo
setInterval(() => {
  if (!state || !state.videoId || applying || current !== state.videoId) return;
  if (Math.abs(P.time() - expected(state)) > 2) send('seek', P.time());
}, 1000);

socket.on('state', apply);
const log = (html, cls) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; $('log').append(d); $('log').scrollTop = 1e9; };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
socket.on('chat', m => log(`<b>${esc(m.name)}</b> ${esc(m.text)}`, 'msg'));
socket.on('system', t => log(esc(t), 'sys'));

$('lobby').onsubmit = e => {
  e.preventDefault();
  const room = ($('roomIn').value.trim() || Math.random().toString(36).slice(2, 7)).toUpperCase();
  socket.emit('join', { room, name: $('name').value.trim() });
  $('roomCode').textContent = room;
  $('lobby').style.display = 'none'; $('app').style.display = 'grid';
};
$('loadForm').onsubmit = e => {
  e.preventDefault();
  const src = parseSrc($('url').value.trim());
  if (!src) return log('Cole um link que comece com https://', 'sys');
  send('load', 0, src); apply(state); $('url').value = '';
};
$('chatForm').onsubmit = e => {
  e.preventDefault();
  const t = $('chatIn').value.trim();
  if (t) socket.emit('chat', t); $('chatIn').value = '';
};
</script>
</body>
</html>
