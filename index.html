<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sessão — assistir junto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171222;--panel:#211a30;--panel2:#2b213d;--line:#3c3052;
  --text:#f5efff;--muted:#a99bbd;--lamp:#ffbd59;--purple:#8554bd;
  color-scheme:dark;font-family:"Bricolage Grotesque",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top left,#2a1d3d 0%,var(--bg) 48%);color:var(--text);min-height:100vh}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:.78rem .95rem}
input{background:var(--panel);color:var(--text);width:100%;min-width:0}
input::placeholder{color:#887b9d}
button{background:var(--lamp);color:#21172b;font-weight:700;border-color:var(--lamp);cursor:pointer;transition:transform .18s,filter .18s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
#lobby{max-width:440px;margin:12vh auto;padding:1.6rem;display:grid;gap:.85rem}
h1{font-size:clamp(2.5rem,9vw,3.2rem);font-weight:800;line-height:.96;margin:0 0 .5rem;letter-spacing:-.04em}
.hint{color:var(--muted);margin:0 0 1rem;line-height:1.5}
#app{display:none;grid-template-columns:minmax(0,1fr) 370px;height:100vh;min-height:0}
#stage{padding:1.1rem;display:flex;flex-direction:column;gap:.9rem;min-width:0;overflow:auto}
.bar{display:flex;gap:.55rem}
.code{color:var(--muted);font-size:.95rem}.code b{color:var(--lamp);font-size:1.2rem;letter-spacing:.1em}
#screen{aspect-ratio:16/9;width:100%;background:#050407;border:1px solid #49365e;border-radius:18px;overflow:hidden;box-shadow:0 18px 70px -28px #b47be0}
#screen iframe,#ytWrap,#vid{width:100%;height:100%;display:block}#vid[hidden],#ytWrap[hidden]{display:none}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:linear-gradient(180deg,#211a30,#191423);min-height:0;overflow:hidden}
.chat-head{padding:1rem 1rem .85rem;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.chat-brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.chat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#7950a8,#432b60);font-size:1.2rem;box-shadow:0 7px 22px #0004}
.chat-title{font-weight:800;letter-spacing:.04em}.chat-sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.online-pill{white-space:nowrap;background:#183b32;color:#8be0b7;border:1px solid #285847;border-radius:999px;padding:.35rem .6rem;font-size:.75rem;font-weight:700}
#people{display:flex;gap:.35rem;flex-wrap:wrap;padding:.65rem 1rem;border-bottom:1px solid #332842;min-height:43px}
.person{display:flex;align-items:center;gap:.35rem;color:#cbbddc;background:#2b213b;border:1px solid #403151;border-radius:999px;padding:.25rem .55rem;font-size:.75rem}
.person-dot{width:7px;height:7px;border-radius:50%;background:#62d69c;box-shadow:0 0 8px #62d69c88}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem;overscroll-behavior:contain}
#log::-webkit-scrollbar{width:6px}#log::-webkit-scrollbar-thumb{background:#49375d;border-radius:9px}
.chat-event{text-align:center;color:#9183a4;font-size:.75rem;padding:.2rem .3rem}
.message{display:flex;flex-direction:column;gap:.28rem;max-width:88%;align-self:flex-start;animation:pop .2s ease-out}
.message.mine{align-self:flex-end;align-items:flex-end}
.message-meta{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#b9a9ca;padding:0 .25rem}
.message-meta strong{color:#e7d9f5;font-size:.77rem}
.creator-tag{color:#ffd18a;background:#49351e;border-radius:999px;padding:.08rem .35rem;font-size:.65rem}
.bubble{background:#30263f;border:1px solid #40334f;border-radius:5px 16px 16px 16px;padding:.7rem .85rem;line-height:1.4;overflow-wrap:anywhere;box-shadow:0 5px 18px #0002}
.mine .bubble{background:linear-gradient(145deg,#7650a3,#63418d);border-color:#8c63b5;border-radius:16px 5px 16px 16px}
.message-time{font-size:.65rem;color:#a99ab8;padding:0 .25rem}
#typing{min-height:22px;padding:0 1rem .35rem;color:#bca9d1;font-size:.75rem}
.typing-dots{display:inline-flex;gap:3px;margin-right:5px;vertical-align:middle}
.typing-dots i{width:4px;height:4px;background:#c6a3e7;border-radius:50%;animation:dot 1s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
#chatForm{display:flex;gap:.5rem;padding:.75rem .85rem calc(.85rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#1b1527}
#chatIn{border-radius:999px;background:#30263f;border-color:#453653;padding:.78rem 1rem}
#chatForm button{width:46px;min-width:46px;height:46px;padding:0;border-radius:50%;font-size:1.1rem}
.emoji-row{display:flex;gap:.25rem;padding:0 .9rem .55rem;background:#1b1527}
.emoji-btn{border:0;background:transparent;color:var(--text);padding:.2rem .35rem;font-size:1.1rem;border-radius:8px}
.emoji-btn:hover{background:#392b4b}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media(max-width:800px){
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(420px,1fr);height:auto;min-height:100vh}
  #stage{padding:.85rem}
  #side{border-left:0;border-top:1px solid var(--line);height:65vh;min-height:460px}
  #screen{border-radius:14px}
  .bar{flex-direction:column}
  .bar button{width:100%}
}
</style>
</head>
<body>
<form id="lobby">
  <h1>Assistir junto, no mesmo segundo.</h1>
  <p class="hint">Crie uma sala e mande o código para os amigos. Play, pausa e pulos ficam sincronizados.</p>
  <input id="name" placeholder="Seu nome" required maxlength="20">
  <input id="roomIn" placeholder="Código da sala (vazio para criar uma)" maxlength="8">
  <button>Entrar na sala</button>
</form>

<main id="app">
  <section id="stage">
    <div class="code">Sala <b id="roomCode"></b> — mande este código para os amigos</div>
    <form class="bar" id="loadForm">
      <input id="url" placeholder="Link do YouTube ou de vídeo (.mp4, .m3u8)">
      <button>Adicionar vídeo</button>
    </form>
    <div id="screen"><div id="ytWrap"><div id="player"></div></div><video id="vid" playsinline controls hidden></video></div>
  </section>
  <aside id="side">
    <header class="chat-head">
      <div class="chat-brand">
        <div class="chat-icon">✦</div>
        <div><div class="chat-title">SESSÃO CHAT</div><div class="chat-sub">Conversa da sala</div></div>
      </div>
      <div class="online-pill" id="onlineCount">● 1 online</div>
    </header>
    <div id="people"></div>
    <div id="log" aria-live="polite"></div>
    <div id="typing"></div>
    <div class="emoji-row" aria-label="Emojis rápidos">
      <button class="emoji-btn" type="button" data-emoji="😀">😀</button>
      <button class="emoji-btn" type="button" data-emoji="😂">😂</button>
      <button class="emoji-btn" type="button" data-emoji="❤️">❤️</button>
      <button class="emoji-btn" type="button" data-emoji="🍿">🍿</button>
      <button class="emoji-btn" type="button" data-emoji="🔥">🔥</button>
      <button class="emoji-btn" type="button" data-emoji="👏">👏</button>
    </div>
    <form id="chatForm">
      <input id="chatIn" placeholder="Digite sua mensagem..." maxlength="500" autocomplete="off">
      <button aria-label="Enviar mensagem" title="Enviar">➤</button>
    </form>
  </aside>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const socket = io();
const vid = $('vid');
let yt, ytReady = false, kind = null, current = null, hls = null, applying = false, state = null;
let isCreator = false, myName = '', typingTimer = null;
const users = new Map();

const expected = s => s.time + (s.playing ? (Date.now() - s.updatedAt) / 1000 : 0);
const ytId = url => (url.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/) || [])[1] || (/^[\w-]{11}$/.test(url) ? url : null);
const parseSrc = input => ytId(input) ? 'yt:' + ytId(input) : /^https?:\/\//.test(input) ? 'url:' + input : null;

const P = {
  time: () => kind === 'yt' ? (ytReady ? yt.getCurrentTime() : 0) : vid.currentTime,
  seek: t => kind === 'yt' ? yt.seekTo(t, true) : (vid.currentTime = t),
  play: () => kind === 'yt' ? yt.playVideo() : vid.play().catch(() => logSystem('Toque no play do vídeo para começar.')),
  pause: () => kind === 'yt' ? yt.pauseVideo() : vid.pause()
};

function onYouTubeIframeAPIReady() {
  yt = new YT.Player('player', { playerVars: { playsinline: 1, rel: 0 },
    events: { onReady: () => { ytReady = true; if (state) apply(state); },
              onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) localChange(true);
                                    if (e.data === YT.PlayerState.PAUSED) localChange(false); } } });
}

function loadSrc(src, t) {
  current = src;
  const i = src.indexOf(':'); kind = src.slice(0, i); const v = src.slice(i + 1);
  $('ytWrap').hidden = kind !== 'yt'; vid.hidden = kind === 'yt';
  if (hls) { hls.destroy(); hls = null; }
  if (kind === 'yt') { vid.pause(); if (ytReady) yt.cueVideoById(v, t); return; }
  if (ytReady) yt.pauseVideo();
  if (/\.m3u8(?:$|\?)/i.test(v) && window.Hls && Hls.isSupported()) {
    hls = new Hls(); hls.loadSource(v); hls.attachMedia(vid);
    hls.on(Hls.Events.ERROR, (_, d) => d.fatal && logSystem('Essa transmissão não abriu. O servidor do vídeo pode bloquear o acesso.'));
  } else vid.src = v;
  vid.addEventListener('loadedmetadata', () => { vid.currentTime = t; }, { once: true });
}

function apply(s) {
  state = s;
  if (!s.videoId || (s.videoId.startsWith('yt:') && !ytReady)) return;
  applying = true;
  if (current !== s.videoId) loadSrc(s.videoId, expected(s));
  else if (Math.abs(P.time() - expected(s)) > 1) P.seek(expected(s));
  s.playing ? P.play() : P.pause();
  setTimeout(() => applying = false, 800);
}

function localChange(playing) {
  if (applying || !state) return;
  if (playing && !state.playing) send('play', P.time());
  if (!playing && state.playing) send('pause', P.time());
}
vid.onplay = () => localChange(true);
vid.onpause = () => localChange(false);
vid.onerror = () => vid.src && logSystem('Esse vídeo não abriu. Use um link direto de vídeo (.mp4, .webm ou .m3u8).');

function send(type, time, videoId) {
  state = { ...state, videoId: videoId ?? state.videoId, playing: type === 'play' || (type === 'seek' && state.playing),
            time: time ?? 0, updatedAt: Date.now() };
  socket.emit('action', { type, time, videoId });
}
setInterval(() => {
  if (!state || !state.videoId || applying || current !== state.videoId) return;
  if (Math.abs(P.time() - expected(state)) > 2) send('seek', P.time());
}, 1000);

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function logSystem(message) {
  const d = document.createElement('div');
  d.className = 'chat-event';
  d.textContent = message;
  $('log').append(d);
  $('log').scrollTop = $('log').scrollHeight;
}
function addMessage(m) {
  const mine = m.name === myName;
  const wrap = document.createElement('div');
  wrap.className = 'message' + (mine ? ' mine' : '');
  const meta = document.createElement('div');
  meta.className = 'message-meta';
  const name = document.createElement('strong');
  name.textContent = m.name;
  meta.append(name);
  if (m.isCreator) {
    const tag = document.createElement('span');
    tag.className = 'creator-tag';
    tag.textContent = 'CRIADOR 👑';
    meta.append(tag);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = m.text;
  const time = document.createElement('div');
  time.className = 'message-time';
  time.textContent = m.time || new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  wrap.append(meta, bubble, time);
  $('log').append(wrap);
  $('log').scrollTop = $('log').scrollHeight;
}
function renderPeople(list) {
  $('onlineCount').textContent = `● ${list.length} online`;
  $('people').replaceChildren();
  list.slice(0, 8).forEach(person => {
    const pill = document.createElement('div');
    pill.className = 'person';
    const dot = document.createElement('span');
    dot.className = 'person-dot';
    const label = document.createElement('span');
    label.textContent = person.name + (person.isCreator ? ' 👑' : '');
    pill.append(dot, label);
    $('people').append(pill);
  });
  if (list.length > 8) {
    const more = document.createElement('span');
    more.className = 'person';
    more.textContent = `+${list.length - 8}`;
    $('people').append(more);
  }
}
function renderTyping(list) {
  const others = list.filter(n => n !== myName);
  $('typing').replaceChildren();
  if (!others.length) return;
  const dots = document.createElement('span');
  dots.className = 'typing-dots';
  dots.innerHTML = '<i></i><i></i><i></i>';
  $('typing').append(dots, document.createTextNode(
    others.length === 1 ? `${others[0]} está digitando...` : `${others.length} pessoas estão digitando...`
  ));
}

socket.on('state', apply);
socket.on('role', data => {
  isCreator = !!data.isCreator;
  $('loadForm').hidden = !isCreator;
  logSystem(isCreator ? 'Você é o criador desta sala! 👑' : 'Você entrou como convidado.');
});
socket.on('presence', renderPeople);
socket.on('typing', renderTyping);
socket.on('chat', addMessage);
socket.on('system', logSystem);

$('lobby').onsubmit = e => {
  e.preventDefault();
  myName = $('name').value.trim();
  const room = ($('roomIn').value.trim() || Math.random().toString(36).slice(2, 7)).toUpperCase();
  socket.emit('join', { room, name: myName });
  $('roomCode').textContent = room;
  $('lobby').style.display = 'none';
  $('app').style.display = 'grid';
};
$('loadForm').onsubmit = e => {
  e.preventDefault();
  if (!isCreator) return logSystem('Somente o criador pode adicionar vídeos.');
  const src = parseSrc($('url').value.trim());
  if (!src) return logSystem('Cole um link válido que comece com https://');
  send('load', 0, src);
  apply(state);
  $('url').value = '';
};
$('chatForm').onsubmit = e => {
  e.preventDefault();
  const t = $('chatIn').value.trim();
  if (t) socket.emit('chat', t);
  $('chatIn').value = '';
  socket.emit('typing', false);
};
$('chatIn').addEventListener('input', () => {
  socket.emit('typing', true);
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => socket.emit('typing', false), 1100);
});
document.querySelectorAll('[data-emoji]').forEach(btn => {
  btn.addEventListener('click', () => {
    $('chatIn').value += btn.dataset.emoji;
    $('chatIn').focus();
    socket.emit('typing', true);
  });
});
</script>
</body>
</html>
